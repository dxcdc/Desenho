services:
  # -------------------------------------------------------------
  # Excalidraw - Web Frontend UI
  # -------------------------------------------------------------
  excalidraw-web:
    image: excalidraw/excalidraw:latest
    container_name: excalidraw-web
    restart: unless-stopped
    ports:
      - "${EXCALIDRAW_PORT:-8080}:80"
    environment:
      - NODE_ENV=production
      - BACKEND_V2_GET_URL=${EXCALIDRAW_ROOM_HTTP_URL:-http://localhost:8081}
      - BACKEND_V2_POST_URL=${EXCALIDRAW_ROOM_HTTP_URL:-http://localhost:8081}
      - WS_SERVER_URL=${EXCALIDRAW_ROOM_WS_URL:-ws://localhost:8081}
    networks:
      - excalidraw-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------
  # Excalidraw Room - WebSocket Backend for Real-Time Collaboration
  # -------------------------------------------------------------
  excalidraw-room:
    image: excalidraw/excalidraw-room:latest
    container_name: excalidraw-room
    restart: unless-stopped
    ports:
      - "${EXCALIDRAW_ROOM_PORT:-8081}:80"
    environment:
      - NODE_ENV=production
      - PORT=80
    networks:
      - excalidraw-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  excalidraw-net:
    driver: bridge
